name: PR Build & Test

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          if [[ "${SDK_VERSION%%.*}" -lt 27 ]]; then
            echo "::error::Xcode 27 with the macOS 27 SDK is required."
            exit 1
          fi
          swift --version

      - name: Build OneClick
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OneClick.xcodeproj \
            -scheme OneClick \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Run Unit Tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project OneClick.xcodeproj \
            -scheme OneClick \
            -configuration Debug \
            -destination "platform=macOS" \
            -only-testing:OneClickTests \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee test-output.log
